[project]
name = "tonyweng-ai-agent-project"
version = "0.1.0"
description = "A RAG-powered badminton club assistant with live court availability, evaluation, feedback, and monitoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=23.0.0",
    "jupyter>=1.1.1",
    "minsearch>=0.2.0",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "streamlit>=1.60.0",
    "tqdm>=4.69.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

