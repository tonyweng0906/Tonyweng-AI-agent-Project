services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-courtmate}
      POSTGRES_USER: ${POSTGRES_USER:-courtmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtmate}
    ports:
      - "5432:5432"
    volumes:
      - courtmate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-courtmate} -d ${POSTGRES_DB:-courtmate}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_JUDGE_MODEL: ${OPENAI_JUDGE_MODEL:-gpt-4o-mini}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-courtmate}
      POSTGRES_USER: ${POSTGRES_USER:-courtmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-courtmate}

      TZ: ${TZ:-America/Toronto}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - courtmate_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  courtmate_postgres_data:
  courtmate_grafana_data: